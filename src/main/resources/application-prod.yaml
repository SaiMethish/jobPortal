spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      username: ${SPRING_DATA_REDIS_USERNAME:default}
      password: ${SPRING_DATA_REDIS_PASSWORD}
      ssl:
        enabled: ${SPRING_DATA_REDIS_SSL_ENABLED:true}
      timeout: ${SPRING_DATA_REDIS_TIMEOUT:5000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

supabase:
  url: ${SUPABASE_URL}
  key: ${SUPABASE_KEY:${SUPABASE_SERVICE_ROLE_KEY}}
  bucket: ${SUPABASE_STORAGE_BUCKET:resumes}

logging:
  level:
    root: WARN
    com.example.jobPortal: INFO
